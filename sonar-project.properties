sonar.organization=angeluciel
sonar.projectKey=angeluciel_planici
sonar.projectName=Planici
sonar.sourceEncoding=UTF-8

sonar.sources=apps,packages

sonar.tests=apps,packages

# apps/api/test holds the e2e specs (*.e2e-spec.ts, which **/*.spec.ts does not match), their setup and fixtures.
# apps/web/tests holds the web tests and their harnesses.
sonar.test.inclusions=\
**/*.spec.ts,\
**/*.spec.tsx,\
**/*.test.ts,\
**/*.test.tsx,\
**/__tests__/**/*,\
apps/api/test/**/*,\
apps/web/tests/**/*

# Test files are listed again here so they are indexed as tests only, not also as sources.
# apps/api/drizzle holds generated migrations.
sonar.exclusions=\
**/*.spec.ts,\
**/*.spec.tsx,\
**/*.test.ts,\
**/*.test.tsx,\
**/__tests__/**,\
apps/api/test/**,\
apps/web/tests/**,\
apps/api/drizzle/**,\
**/node_modules/**,\
**/.next/**,\
**/dist/**,\
**/coverage/**,\
**/coverage-e2e/**,\
**/.turbo/**

# Still analyzed for issues, but left out of coverage: Nest module wiring, the bootstrap and Drizzle table declarations.
sonar.coverage.exclusions=\
**/*.module.ts,\
apps/api/src/main.ts,\
apps/api/src/database/schema/**

# Paths inside each report are relative to the repository root. Sonar merges reports that cover the same file.
sonar.javascript.lcov.reportPaths=\
apps/api/coverage/lcov.info,\
apps/api/coverage-e2e/lcov.info,\
apps/web/coverage/lcov.info