services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    restart: always
    # Server-side BFF -> api wiring (JOA-39 answers.md #12): apps/web's
    # route handlers (apps/web/src/app/api/_lib/http.ts, `requiredEnv
    # ("API_URL")`) call this from inside the web container, over the
    # internal network — `api:3030` (the compose service/port), not the
    # :3333 used by `apps/web/.env.local` for bare `next dev` on the host.
    # Not a secret, so set directly here rather than via .env.compose.
    environment:
      API_URL: http://api:3030/api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 3000:3000
    networks:
      - planici_network

  # Throwaway Postgres 17 — data dir is tmpfs (not a named/anonymous volume),
  # so `docker compose down` discards all data and no volume is ever left on
  # disk (postgres:17 declares an image VOLUME at this path; tmpfs here
  # pre-empts Docker from creating an anonymous volume for it).
  # `migrate`/`api`/`smoke` reach it at host `db`.
  db:
    container_name: db
    image: postgres:17
    restart: always
    env_file:
      - .env.compose
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - planici_network

  # One-shot: drizzle migrations as the owner role (DATABASE_URL), then the
  # planici_app role bootstrap (JOA-39 answers.md #2). Runs the `tools`
  # build stage of the api Dockerfile (full deps + psql; not the ECS image).
  migrate:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
      target: tools
    env_file:
      - .env.compose
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - >
        node node_modules/drizzle-kit/bin.cjs migrate &&
        psql "$$DATABASE_URL" -v ON_ERROR_STOP=1
        -v app_role="$$APP_ROLE" -v app_password="$$APP_PASSWORD"
        -f src/database/bootstrap/app-role.sql
    networks:
      - planici_network

  api:
    container_name: api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: always
    env_file:
      - .env.compose
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - 3030:3030
    networks:
      - planici_network

  # RLS smoke check (JOA-39 answers.md #1, #7, #8): `docker compose
  # --profile smoke run --rm smoke`. Connects as planici_app and asserts
  # NOSUPERUSER / NOBYPASSRLS, zero rows on `_rls_probe` with no tenant set,
  # and that `GET /api/health` returns HTTP 200 AND body `"database":"up"`
  # (explicit body check, not just curl -f on the status code — a 503 would
  # already fail -f, but this also catches a 200 with a lying/degraded body).
  # Non-zero exit on any failure.
  smoke:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
      target: tools
    profiles: ["smoke"]
    env_file:
      - .env.compose
    depends_on:
      api:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -eu
        echo "[smoke] checking planici_app role attributes..."
        result=$$(psql "$$DATABASE_URL_APP" -Atc \
          "select rolsuper, rolbypassrls from pg_roles where rolname = '$$APP_ROLE'")
        [ "$$result" = "f|f" ] || { echo "[smoke] FAIL: planici_app rolsuper/rolbypassrls = $$result (expected f|f)"; exit 1; }
        echo "[smoke] OK: rolsuper=f rolbypassrls=f"

        echo "[smoke] checking RLS fail-closed (_rls_probe, no tenant set)..."
        count=$$(psql "$$DATABASE_URL_APP" -Atc "select count(*) from _rls_probe")
        [ "$$count" = "0" ] || { echo "[smoke] FAIL: _rls_probe returned $$count rows (expected 0)"; exit 1; }
        echo "[smoke] OK: _rls_probe = 0 rows"

        echo "[smoke] checking GET /api/health returns 200 with database up..."
        http_code=$$(curl -sS -o /tmp/health.json -w "%{http_code}" "http://api:$${PORT}/api/health")
        body=$$(cat /tmp/health.json)
        [ "$$http_code" = "200" ] || { echo "[smoke] FAIL: /api/health returned HTTP $$http_code (expected 200): $$body"; exit 1; }
        echo "$$body" | grep -q '"database":"up"' || { echo "[smoke] FAIL: /api/health body missing \"database\":\"up\": $$body"; exit 1; }
        echo "[smoke] OK: /api/health = 200 $$body"
        echo "[smoke] ALL CHECKS PASSED"
    networks:
      - planici_network

  # --- dev profile (JOA-39 answers.md #11): local dev DB only, never started
  # by a bare `docker compose up` or by `--profile smoke` (both `db-dev` and
  # `migrate-dev` opt in via `profiles: ["dev"]`, so they're inert unless
  # named/activated explicitly). Unlike `db` above, this Postgres uses a
  # NAMED volume — data survives `docker compose down` and is only wiped by
  # an explicit `down -v`. Values below are `${VAR:-default}` compose-file
  # interpolation (resolved from the shell env or a root `.env`/--env-file,
  # NOT from `.env.compose`'s `env_file:` — see `.env.dev.example`), so
  # owners can override them locally without agents ever touching env files.
  # Usage: `docker compose --profile dev up -d db-dev migrate-dev` (name the
  # services explicitly — Compose still starts every profile-less service
  # above alongside a bare `--profile dev up -d` with no service names).
  db-dev:
    container_name: db-dev
    image: postgres:17
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      POSTGRES_DB: ${PLANICI_DEV_DB_NAME:-planici}
      POSTGRES_USER: ${PLANICI_DEV_DB_USER:-planici}
      POSTGRES_PASSWORD: ${PLANICI_DEV_DB_PASSWORD:-planici}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - planici_dev_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - planici_network

  # One-shot, same `tools` image/pattern as `migrate`: drizzle migrations as
  # the owner role against `db-dev`, then `app-role.sql` so local dev also
  # exercises the RLS-constrained `planici_app` role (not the owner) — same
  # as prod, per answers.md #11.
  migrate-dev:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
      target: tools
    profiles: ["dev"]
    environment:
      DATABASE_URL: postgres://${PLANICI_DEV_DB_USER:-planici}:${PLANICI_DEV_DB_PASSWORD:-planici}@db-dev:5432/${PLANICI_DEV_DB_NAME:-planici}
      APP_ROLE: ${PLANICI_DEV_APP_ROLE:-planici_app}
      APP_PASSWORD: ${PLANICI_DEV_APP_PASSWORD:-planici_app_dev}
    depends_on:
      db-dev:
        condition: service_healthy
    command:
      - sh
      - -c
      - >
        node node_modules/drizzle-kit/bin.cjs migrate &&
        psql "$$DATABASE_URL" -v ON_ERROR_STOP=1
        -v app_role="$$APP_ROLE" -v app_password="$$APP_PASSWORD"
        -f src/database/bootstrap/app-role.sql
    networks:
      - planici_network

networks:
  planici_network:
    name: planici_network

volumes:
  planici_dev_db:
