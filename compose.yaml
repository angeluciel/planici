services:
  api:
    container_name: api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5000
    networks: [planici_network]

  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_INTERNAL_URL: http://api:5000
    networks: [planici_network]
  
  proxy:
    build: ./docker/proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/proxy/certs:/certs:ro
    depends_on: [web, api]
    restart: unless-stopped
    networks: [planici_network]

networks:
  planici_network: {}