name: planici-sonar
version: "3"

services:
  sonarqube:
    image: sonarqube:26.9.0.129388-community
    depends_on:
      sonar-db:
        condition: service_healthy

    ports:
      - "9000:9000"

    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Set SONAR_DB_PASSWORD}

    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_logs:/opt/sonarqube/logs
      - sonar_extensions:/opt/sonarqube/extensions

    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192

  sonar-db:
    image: postgres:17

    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Set SONAR_DB_PASSWORD}
      POSTGRES_DB: sonar

    volumes:
      - sonar_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  sonar_data:
  sonar_logs:
  sonar_extensions:
  sonar_db_data:
