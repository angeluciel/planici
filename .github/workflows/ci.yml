name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          runtime: node@24
          cache: true
          install: false
      
      - run: pnpm ci
      - run: pnpm lint
      - run: pnpm typecheck
  
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          runtime: node@24
          cache: true
          install: false
      
      - run: pnpm ci

      - run: pnpm test

      - name: API Coverage
        run: pnpm --filter api test:cov

  e2e:
    name: API E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: planici_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          runtime: node@24
          cache: true
          install: false
      
      - run: pnpm ci

      - name: Run API E2E Tests
        run: pnpm --filter api test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/planici_test
    
  build:
    name: Build
    needs: [quality, test, e2e]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          runtime: node@24
          cache: true
          install: false
      
      - run: pnpm ci
      - run: pnpm build

  sonar:
    name: SonarQube Analysis
    needs: [quality, test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          runtime: node@24
          cache: true
          install: false

      - run: pnpm ci

      - name: Generate API Coverage
        run: pnpm --filter api test:cov

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
