name: CI

on:
  pull_request:
    branches: [main, dev]
  # Analyzes main after each merge so SonarCloud has a baseline for new-code checks on pull requests.
  push:
    branches: [main]
  # CD calls this workflow to re-check the exact commit a release tag points at.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          runtime: node@24
          cache: true
          install: false
      
      - run: pnpm ci
      - run: pnpm lint
      - run: pnpm typecheck
  
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          runtime: node@24
          cache: true
          install: false
      
      - run: pnpm ci

      - run: pnpm test

      - name: API Coverage
        run: pnpm --filter api test:cov

      - name: Upload API Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-${{ github.sha }}
          path: apps/api/coverage/
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: API E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          runtime: node@24
          cache: true
          install: false

      - run: pnpm ci
      
      - name: Build API workspace dependencies
        run: pnpm --filter "api^..." run build

      - name: Run API E2E Tests
        run: pnpm --filter api test:e2e
    
  build:
    name: Build
    needs: [quality, test, e2e]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          runtime: node@24
          cache: true
          install: false
      
      - run: pnpm ci
      - run: pnpm build

  sonar:
    name: SonarQube Analysis
    needs: [quality, test]
    # Reporting only, and it needs SONAR_TOKEN: run it on pull requests and on pushes to main, not as part of a release gate.
    # When CD calls this workflow for a release tag, event_name is also 'push', so match the main ref exactly.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        with:
          runtime: node@24
          cache: true
          install: false

      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: api-coverage-${{ github.sha }}
          path: apps/api/coverage/

      - run: pnpm ci

      - name: Build api and web workspace dependencies
        run: pnpm --filter "api^..." --filter "web^..." run build

      - name: Generate API Coverage
        run: pnpm --filter api test:cov

      # Controllers, repositories and adapters are covered by the e2e suite, not by unit tests.
      - name: Generate API E2E Coverage
        run: pnpm --filter api test:e2e --coverage

      - name: Generate Web Coverage
        run: pnpm --filter web test:cov

      - name: Verify LCOV Reports
        run: |
          test -s apps/api/coverage/lcov.info
          test -s apps/api/coverage-e2e/lcov.info
          test -s apps/web/coverage/lcov.info

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
