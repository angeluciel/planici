name: frontend

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions@checkout@v6

      - name: Set up tools using mise
        uses: jdx/mise-actions@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  node-compatibility:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node:
          - 24.16.0
          - 26.5.0

    steps:
      - uses: actions/checkout@v6
        with:
          version: 10
      - uses: action/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
